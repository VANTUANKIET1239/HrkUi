<form [formGroup]="dataForm" (ngSubmit)="submit()" class="game-form" novalidate>
  <!-- Username Field -->
  <div class="form-group">
    <label class="field-label" for="reg-username">
      <i class="bi bi-person-badge-fill icon-gold"></i> Tên Tướng Quân / Username
    </label>
    <div class="input-container" [class.error-border]="hasErr('username')">
      <hrk-input
        id="reg-username"
        type="text"
        formControlName="username"
        [invalid]="hasErr('username')"
        placeholder="Nhập tên nhân vật hoặc tài khoản"
      ></hrk-input>
    </div>
    <small class="error-msg" *ngIf="hasErr('username')">
      <i class="bi bi-exclamation-triangle-fill"></i> Tên tài khoản yêu cầu từ 3 ký tự trở lên.
    </small>
  </div>

  <!-- Email Field -->
  <div class="form-group">
    <label class="field-label" for="reg-email">
      <i class="bi bi-envelope-fill icon-gold"></i> Email liên kết
    </label>
    <div class="input-container" [class.error-border]="hasErr('email')">
      <hrk-input
        id="reg-email"
        type="email"
        autocomplete="username"
        formControlName="email"
        [invalid]="hasErr('email')"
        placeholder="chucong@dcs-game.com"
      ></hrk-input>
    </div>
    <small class="error-msg" *ngIf="hasErr('email')">
      <i class="bi bi-exclamation-triangle-fill"></i> Email không đúng định dạng.
    </small>
  </div>

  <!-- Password Field -->
  <div class="form-group">
    <label class="field-label" for="reg-password">
      <i class="bi bi-key-fill icon-gold"></i> Mật khẩu bảo mật
    </label>
    <div class="pwd-input-wrap" [class.error-border]="hasErr('password')">
      <hrk-input
        id="reg-password"
        formControlName="password"
        [type]="showPwd() ? 'text' : 'password'"
        autocomplete="new-password"
        placeholder="••••••••"
      ></hrk-input>
      <button type="button" class="btn-pwd-toggle" aria-label="Toggle password visibility" (click)="toggleShowPwd()">
        <hrk-icon [biIconName]="showPwd() ? 'bi-eye-fill' : 'bi-eye-slash-fill'" size="medium" color="#ffd700"></hrk-icon>
      </button>
    </div>
    <small class="error-msg" *ngIf="hasErr('password')">
      <i class="bi bi-exclamation-triangle-fill"></i> Mật khẩu cần tối thiểu 6 ký tự.
    </small>
  </div>

  <!-- Confirm Password Field -->
  <div class="form-group">
    <label class="field-label" for="reg-confirm-pwd">
      <i class="bi bi-shield-check icon-gold"></i> Xác nhận mật khẩu
    </label>
    <div class="pwd-input-wrap" [class.error-border]="hasPasswordMismatch() || hasErr('confirmPassword')">
      <hrk-input
        id="reg-confirm-pwd"
        formControlName="confirmPassword"
        [type]="showConfirmPwd() ? 'text' : 'password'"
        autocomplete="new-password"
        placeholder="••••••••"
      ></hrk-input>
      <button type="button" class="btn-pwd-toggle" aria-label="Toggle password visibility" (click)="toggleShowConfirmPwd()">
        <hrk-icon [biIconName]="showConfirmPwd() ? 'bi-eye-fill' : 'bi-eye-slash-fill'" size="medium" color="#ffd700"></hrk-icon>
      </button>
    </div>
    <small class="error-msg" *ngIf="hasPasswordMismatch()">
      <i class="bi bi-exclamation-triangle-fill"></i> Mật khẩu xác nhận không khớp!
    </small>
  </div>

  <!-- Terms Checkbox -->
  <div class="form-actions-row">
    <label class="checkbox-label">
      <hrk-checkbox formControlName="agreeTerms" backgroundColor="#ffd700"></hrk-checkbox>
      <span class="remember-text">Tôi đồng ý với <a href="#" class="game-link" (click)="$event.preventDefault()">Điều khoản Chinh Phạt</a></span>
    </label>
  </div>

  <!-- Submit Register Button -->
  <div class="submit-wrap">
    <button type="submit" class="game-btn-primary" [disabled]="loading()">
      <span class="btn-glow"></span>
      <span class="btn-text" *ngIf="!loading()">
        <i class="bi bi-person-plus-fill"></i> KHỞI TẠO TÀI KHOẢN
      </span>
      <span class="btn-text" *ngIf="loading()">
        <i class="bi bi-arrow-repeat spin"></i> ĐANG KHỞI TẠO...
      </span>
    </button>
  </div>

  <!-- Switch to Login -->
  <div class="switch-prompt">
    <span>Đã có tài khoản Chinh Phạt?</span>
    <a href="#" class="game-link-highlight" (click)="onGoToLogin($event)">ĐĂNG NHẬP NGAY</a>
  </div>
</form>
