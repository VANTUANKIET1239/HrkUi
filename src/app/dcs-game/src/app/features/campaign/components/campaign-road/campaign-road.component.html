<div class="road-container">
  <!-- Interactive SVG S-Curve Journey Line -->
  <svg
    class="road-svg"
    [attr.viewBox]="viewBox"
    preserveAspectRatio="none"
    xmlns="http://www.w3.org/2000/svg"
  >
    <defs>
      <!-- Gold / Cyan Glow Filter -->
      <filter id="roadGlow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <!-- Gradient for Unlocked Road -->
      <linearGradient id="unlockedRoadGrad" x1="0%" y1="100%" x2="0%" y2="0%">
        <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9" />
        <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.95" />
        <stop offset="100%" stop-color="#a855f7" stop-opacity="1" />
      </linearGradient>

      <!-- Gradient for Unlocked Core Beam -->
      <linearGradient id="unlockedBeamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
        <stop offset="0%" stop-color="#fef08a" />
        <stop offset="50%" stop-color="#e0f2fe" />
        <stop offset="100%" stop-color="#f5d0fe" />
      </linearGradient>
    </defs>

    <!-- 1. Deep Shadow Beneath Road -->
    <path
      [attr.d]="fullPathD"
      class="road-path-shadow"
      fill="none"
      stroke="#000000"
      stroke-width="36"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.75"
    />

    <!-- 2. Weathered Cobblestone/Base Track (All 15 Stages) -->
    <path
      [attr.d]="fullPathD"
      class="road-path-base"
      fill="none"
      stroke="#1e293b"
      stroke-width="26"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- 3. Base Inner Border Rim -->
    <path
      [attr.d]="fullPathD"
      class="road-path-rim"
      fill="none"
      stroke="#334155"
      stroke-width="20"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-dasharray="8 6"
    />

    <!-- 4. Unlocked Outer Radiant Glow -->
    <path
      *ngIf="unlockedPathD"
      [attr.d]="unlockedPathD"
      class="road-path-unlocked-glow"
      fill="none"
      stroke="url(#unlockedRoadGrad)"
      stroke-width="22"
      stroke-linecap="round"
      stroke-linejoin="round"
      filter="url(#roadGlow)"
    />

    <!-- 5. Unlocked Solid Energetic Core -->
    <path
      *ngIf="unlockedPathD"
      [attr.d]="unlockedPathD"
      class="road-path-unlocked-core"
      fill="none"
      stroke="url(#unlockedBeamGrad)"
      stroke-width="8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- 6. Animated Travelling Energy Motes along Unlocked Road -->
    <path
      *ngIf="unlockedPathD"
      [attr.d]="unlockedPathD"
      class="road-path-energy-stream"
      fill="none"
      stroke="#ffffff"
      stroke-width="6"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-dasharray="16 48"
    />
  </svg>

  <!-- Node Projection Canvas slot -->
  <div class="road-nodes-layer">
    <ng-content></ng-content>
  </div>
</div>
