<div class="battle-container"
  [class.battle-paused]="battleEngine.status() === 'paused'"
  [style.--battle-speed]="battleEngine.speed()"
  [style.--visual-speed]="battleEngine.currentVisualSpeed()">

  <!-- 1. Fantasy RPG Header UI -->
  <app-battle-header
    [leaderAvatar]="getLeaderAvatar()"
    [powerScore]="getPowerScore()"
    [currentTurn]="battleEngine.currentTurn()"
    (onReplay)="replay()"
    (onExit)="exitBattle()">
  </app-battle-header>

  <!-- 2. Non-blocking Skill Casting Notification Banner (Top Center) -->
  <app-battle-notification
    [skillName]="battleEngine.currentSkillName()"
    [skillColor]="battleEngine.currentSkillColor()"
    [actorName]="getActorName()"
    [skillCategory]="battleEngine.currentSkillCategory()">
  </app-battle-notification>

  <!-- 3. Primary Battlefield Area (Majority of Screen) -->
  <main class="battlefield" [class.screen-shake]="isScreenShaking()" role="region" aria-label="Chiến trường">

    <!-- Global Skill VFX Host (Z-index 30, pointer-events: none) -->
    <app-battle-skill-vfx-host
      [skillId]="battleEngine.currentVisualSkillId()"
      [actorActive]="battleEngine.visualActorId() !== null"
      [impactActive]="battleEngine.activeTargetIds().length > 0"
      [actorTeamRight]="battleEngine.isActorTeamRight()"
      [isEmpowered]="battleEngine.isVisualEmpowered()"
      [visualSpeed]="battleEngine.currentVisualSpeed()">
    </app-battle-skill-vfx-host>

    <!-- 3D Sa-Ban Battlefield Grid -->
    <div class="battlefield-grid">
      <!-- Player Team (Left: Blue/Gold theme) -->
      <div *ngFor="let hero of getLeftTeam()" class="grid-cell pos-left-{{ hero.position }}" [attr.data-team]="'left'">
        <app-battle-character 
          [character]="hero" 
          [isCharging]="battleEngine.visualActorId() === hero.id"
          [isHit]="battleEngine.isTargetHit(hero.id)" 
          [skillColor]="battleEngine.currentSkillColor()"
          [damageEvent]="battleEngine.damageEvents()[hero.id] || null" 
          [activeSkillId]="battleEngine.currentVisualSkillId()"
          [activeSkillCategory]="battleEngine.currentSkillCategory()" 
          [activeActor]="battleEngine.activeActor()"
          [phase]="battleEngine.visualPhase()"
          [visualSpeed]="battleEngine.currentVisualSpeed()"
          [castSequence]="battleEngine.visualCastSequence()"
          [isEmpowered]="battleEngine.isVisualEmpowered()">
        </app-battle-character>
      </div>

      <!-- Central VS Field Divider -->
      <div class="battlefield-divider">
        <div class="vs-label">VS</div>
      </div>

      <!-- Opponent Team (Right: Red/Purple theme) -->
      <div *ngFor="let enemy of getRightTeam()" class="grid-cell pos-right-{{ enemy.position }}" [attr.data-team]="'right'">
        <app-battle-character 
          [character]="enemy" 
          [isCharging]="battleEngine.visualActorId() === enemy.id"
          [isHit]="battleEngine.isTargetHit(enemy.id)" 
          [skillColor]="battleEngine.currentSkillColor()"
          [damageEvent]="battleEngine.damageEvents()[enemy.id] || null" 
          [activeSkillId]="battleEngine.currentVisualSkillId()"
          [activeSkillCategory]="battleEngine.currentSkillCategory()" 
          [activeActor]="battleEngine.activeActor()"
          [phase]="battleEngine.visualPhase()"
          [visualSpeed]="battleEngine.currentVisualSpeed()"
          [castSequence]="battleEngine.visualCastSequence()"
          [isEmpowered]="battleEngine.isVisualEmpowered()">
        </app-battle-character>
      </div>
    </div>
  </main>

  <!-- 4. Bottom Controls & Action Turn Queue -->
  <footer class="bottom-ui-wrapper">
    <!-- Turn Queue Strip -->
    <div class="action-timeline" *ngIf="battleEngine.turnQueue().length > 0">
      <div class="timeline-header-text">LƯỢT KẾ TIẾP</div>
      <div class="timeline-queue">
        <div *ngFor="let queueHero of battleEngine.turnQueue(); let first = first" 
          class="queue-item-frame"
          [ngClass]="{ 'active-highlight': first, 'team-left': queueHero.team === 'left', 'team-right': queueHero.team === 'right' }"
          [title]="queueHero.name">
          <img [src]="queueHero.avatar" class="queue-avatar" [alt]="queueHero.name" />
          <div class="queue-border-color" [ngClass]="queueHero.team"></div>
        </div>
      </div>
    </div>

    <!-- Compact Floating Control Bar -->
    <div class="controls-container">
      <app-battle-controls
        [status]="battleEngine.status()"
        [speed]="battleEngine.speed()"
        [isLogOpen]="isLogOpen()"
        (onTogglePlay)="togglePlay()"
        (onSpeedChange)="onSpeedChange($event)"
        (onSkip)="openSkipModal()"
        (onToggleLog)="toggleLog()">
      </app-battle-controls>
    </div>
  </footer>

  <!-- 5. Floating Collapsible Battle Log Panel (Z-index 80) -->
  <aside class="narrative-panel-container" *ngIf="isLogOpen() && battleEngine.narrativeLogs().length">
    <app-battle-log-panel [logs]="battleEngine.narrativeLogs()"></app-battle-log-panel>
  </aside>

  <!-- 6. Skip Battle Confirmation Modal (Z-index 500) -->
  <app-battle-skip-confirm-modal
    [isOpen]="isSkipModalOpen()"
    (onConfirm)="confirmSkip()"
    (onCancel)="closeSkipModal()">
  </app-battle-skip-confirm-modal>

  <!-- 7. Victory / Defeat Results Modal (Z-index 1000) -->
  <app-battle-result-modal 
    *ngIf="battleEngine.status() === 'finished'" 
    [isVictory]="isPlayerVictory()"
    [totalTurns]="battleEngine.currentTurn()" 
    [aliveCount]="getAliveCount('left')"
    [totalRemainingHp]="getTotalHp('left')" 
    [dungeonResult]="dungeonSession.current()?.result"
    (onReplay)="replay()" 
    (onExit)="exitBattle()">
  </app-battle-result-modal>

  <!-- Universal Equipment Tooltip Host -->
  <app-equipment-tooltip></app-equipment-tooltip>

</div>
