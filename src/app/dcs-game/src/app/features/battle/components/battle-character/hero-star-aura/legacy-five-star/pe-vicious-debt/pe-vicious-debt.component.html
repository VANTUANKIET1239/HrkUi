<div class="vicious-debt-vortex">
  <!-- 1. The central protective black hole void bubble -->
  <div class="black-hole-void">
    <div class="void-cloud-inner"></div>
    <div class="void-cloud-outer"></div>
  </div>

  <!-- 2. Orbiting Swarm of Poker Chips and Soccer Ball Shards -->
  <div class="swirling-swarm">
    <!-- Obsidian Poker Chips with violet-black glowing centers -->
    <div class="poker-chip pc1">
      <div class="chip-inner"></div>
    </div>
    <div class="poker-chip pc2">
      <div class="chip-inner"></div>
    </div>
    <div class="poker-chip pc3">
      <div class="chip-inner"></div>
    </div>
    <div class="poker-chip pc4">
      <div class="chip-inner"></div>
    </div>

    <!-- Shards of dark soccer ball material -->
    <div class="soccer-shard ss1"></div>
    <div class="soccer-shard ss2"></div>
    <div class="soccer-shard ss3"></div>
    <div class="soccer-shard ss4"></div>
  </div>

  <!-- 3. Shadowy hands grasping at green/red NỢ symbols -->
  <div class="debt-cloud">
    <!-- NỢ symbols dissolving and moving towards center -->
    <span class="debt-symbol n1" [ngClass]="isBankrupt ? 'gloomy-purple' : 'green-n'">NỢ</span>
    <span class="debt-symbol n2" [ngClass]="isBankrupt ? 'gloomy-purple' : 'red-n'">NỢ</span>
    <span class="debt-symbol n3" [ngClass]="isBankrupt ? 'gloomy-purple' : 'green-n'">NỢ</span>
    <span class="debt-symbol n4" [ngClass]="isBankrupt ? 'gloomy-purple' : 'red-n'">NỢ</span>
    <span class="debt-symbol n5" [ngClass]="isBankrupt ? 'gloomy-purple' : 'green-n'">NỢ</span>
    <span class="debt-symbol n6" [ngClass]="isBankrupt ? 'gloomy-purple' : 'red-n'">NỢ</span>

    <!-- Shadowy black hands constantly grasping at them -->
    <span class="shadowy-hand sh1">🫳</span>
    <span class="shadowy-hand sh2">🫴</span>
    <span class="shadowy-hand sh3">✊</span>
    <span class="shadowy-hand sh4">🖐️</span>
  </div>

  <!-- 4. Ghostly, chains-of-debt construct -->
  <div class="ghostly-chains">
    <div class="chain-ring cr1">⛓️</div>
    <div class="chain-ring cr2">⛓️</div>
    <div class="chain-ring cr3">⛓️</div>
    <div class="chain-ring cr4">⛓️</div>
  </div>

  <!-- 5. Flickering black lightning effect feeding into the vortex from phone screen -->
  <!-- QA Kỹ Tính holds his phone in his left hand (relative to sprite layout) -->
  <div class="phone-lightning-emitter">
    <div class="phone-screen-glow"></div>
    <div class="lightning-bolt l1">⚡</div>
    <div class="lightning-bolt l2">⚡</div>
  </div>
</div>
