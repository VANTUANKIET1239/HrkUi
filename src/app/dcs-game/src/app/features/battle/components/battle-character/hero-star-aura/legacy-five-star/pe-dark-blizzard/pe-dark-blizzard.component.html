<div class="dark-blizzard-vortex">
  <!-- 1. BACKGROUND LAYERS (Rendered behind character at z-index: 2) -->
  
  <!-- Ground Runic Magic Circle -->
  <div class="frost-magic-circle">
    <div class="outer-runic-ring">
      <span class="rune fr1">ᛟ</span>
      <span class="rune fr2">ᚲ</span>
      <span class="rune fr3">ᚻ</span>
      <span class="rune fr4">ᛏ</span>
      <span class="rune fr5">ᛉ</span>
      <span class="rune fr6">ᛋ</span>
      <span class="rune fr7">ᛁ</span>
      <span class="rune fr8">ᛒ</span>
    </div>
    <div class="inner-glowing-ring"></div>
    <div class="snowflake-core">❄</div>
  </div>

  <!-- Freezing black mist columns rising -->
  <div class="mist-column mc1"></div>
  <div class="mist-column mc2"></div>
  <div class="mist-column mc3"></div>

  <!-- Freezing black mist and wind swirls -->
  <div class="wind-spiral ws1"></div>
  <div class="wind-spiral ws2"></div>
  <div class="wind-spiral ws3"></div>

  <!-- Swirling Wind Trails (curved light streaks) -->
  <div class="wind-trail wt1"></div>
  <div class="wind-trail wt2"></div>

  <!-- Core cold glow emitting from torso/sack -->
  <div class="core-frost-glow">
    <div class="glow-pulse-blue"></div>
    <div class="glow-pulse-purple"></div>
  </div>

  <!-- Rising Frozen Icicles / Shards -->
  <div class="ice-shards-container">
    <span class="ice-shard is1">✦</span>
    <span class="ice-shard is2">✧</span>
    <span class="ice-shard is3">✦</span>
    <span class="ice-shard is4">✧</span>
    <span class="ice-shard is5">✦</span>
  </div>

  <!-- 2. DYNAMIC 3D ORBITING ITEMS (Z-Index wraps between 4 and 6) -->
  <div class="orbiting-items">
    <div class="orbit-gift og1">🎁</div>
    <div class="orbit-gift og2">🎁</div>
    <div class="orbit-gift og3">🎁</div>
    <div class="orbit-gift og4">🎁</div>
    <div class="orbit-gift og5">🎁</div>
    <div class="orbit-gift og6">🎁</div>

    <!-- Light-catching black snowflakes -->
    <div class="orbit-snowflake os1">❄️</div>
    <div class="orbit-snowflake os2">❄️</div>
    <div class="orbit-snowflake os3">❄️</div>
    <div class="orbit-snowflake os4">❄️</div>
    <div class="orbit-snowflake os5">❄️</div>
    <div class="orbit-snowflake os6">❄️</div>
    <div class="orbit-snowflake os7">❄️</div>
  </div>
</div>
