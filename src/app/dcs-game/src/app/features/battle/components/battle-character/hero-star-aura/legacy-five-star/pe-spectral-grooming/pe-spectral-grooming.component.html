<div class="spectral-grooming-swarm">
  <!-- 1. Pulse of golden light originating from the belt area -->
  <div class="belt-glow-emitter">
    <div class="glow-pulse"></div>
    <div class="glow-flare"></div>
  </div>

  <!-- 2. Textured nebula cloud of fine hair and distinct dissolving hair locks -->
  <div class="hair-nebula">
    <div class="hair-cloud-bg"></div>
    <!-- Fine hair particles -->
    <span class="hair-particle hp1"></span>
    <span class="hair-particle hp2"></span>
    <span class="hair-particle hp3"></span>
    <span class="hair-particle hp4"></span>
    <span class="hair-particle hp5"></span>
    <span class="hair-particle hp6"></span>
    <span class="hair-particle hp7"></span>
    <span class="hair-particle hp8"></span>

    <!-- Distinct resolving/dissolving locks of hair -->
    <span class="hair-lock hl1"></span>
    <span class="hair-lock hl2"></span>
    <span class="hair-lock hl3"></span>
    <span class="hair-lock hl4"></span>
  </div>

  <!-- 3. Barber Tools Swarm in slow, hypnotic 3D orbits -->
  <div class="tools-swarm">
    <!-- Pair of golden barber scissors 1 (Clockwise) -->
    <div class="tool tool-scissors sc1">
      <div class="scissor-wrapper">
        <div class="scissor-half left-half"></div>
        <div class="scissor-half right-half"></div>
        <div class="scissor-joint"></div>
      </div>
    </div>

    <!-- Pair of golden barber scissors 2 (Counter-Clockwise) -->
    <div class="tool tool-scissors sc2">
      <div class="scissor-wrapper">
        <div class="scissor-half left-half"></div>
        <div class="scissor-half right-half"></div>
        <div class="scissor-joint"></div>
      </div>
    </div>

    <!-- Classic barber clippers 1 (Clockwise) -->
    <div class="tool tool-clippers cp1">
      <div class="clipper-body"></div>
      <div class="clipper-blade"></div>
      <div class="clipper-shimmer"></div>
    </div>

    <!-- Classic barber clippers 2 (Counter-Clockwise) -->
    <div class="tool tool-clippers cp2">
      <div class="clipper-body"></div>
      <div class="clipper-blade"></div>
      <div class="clipper-shimmer"></div>
    </div>

    <!-- Golden Comb (Clockwise) -->
    <div class="tool tool-comb cb1">
      <div class="comb-spine"></div>
      <div class="comb-teeth"></div>
    </div>

    <!-- Brown Comb (Counter-Clockwise) -->
    <div class="tool tool-comb cb2">
      <div class="comb-spine"></div>
      <div class="comb-teeth"></div>
    </div>
  </div>

  <!-- 4. Delicate runic script woven into the swarm's edge (comb & shear symbols) -->
  <div class="runic-boundary">
    <div class="rune r1">✂️</div>
    <div class="rune r2">🪮</div>
    <div class="rune r3">💈</div>
    <div class="rune r4">✂️</div>
    <div class="rune r5">🪮</div>
    <div class="rune r6">💈</div>
    <div class="rune r7">✂️</div>
    <div class="rune r8">🪮</div>
  </div>
</div>
