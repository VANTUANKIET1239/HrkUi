<div class="deadlift-dia-chan-fx" [ngClass]="{ 'team-right': isTeamRight }">
  <!-- Golden Neon Belt Surge (Phase 1) -->
  <div class="belt-neon-surge">
    <div class="surge-line sl1"></div>
    <div class="surge-line sl2"></div>
    <div class="surge-glow"></div>
  </div>

  <!-- Red Muscle Expansion Power Aura (Phase 1 & 2) -->
  <div class="muscle-power-aura">
    <div class="power-flame pf1"></div>
    <div class="power-flame pf2"></div>
    <div class="power-sparks">
      <span class="psp ps1">🔥</span>
      <span class="psp ps2">⚡</span>
      <span class="psp ps3">🔥</span>
    </div>
  </div>

  <!-- Caster Ground Slam Seismic Shockwave (Phase 2) -->
  <div class="seismic-shockwave">
    <div class="wave-ring wr1"></div>
    <div class="wave-ring wr2"></div>
    <div class="gold-flash"></div>
  </div>
</div>
