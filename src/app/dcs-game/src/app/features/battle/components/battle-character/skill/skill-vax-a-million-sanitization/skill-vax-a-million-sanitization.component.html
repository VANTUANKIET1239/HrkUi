<div class="sanitization-beam-fx" [ngClass]="{ 'team-right': isTeamRight, 'team-left': !isTeamRight }">
  <div class="sanitization-charging-aura"></div>
  <div class="liquid-injection-tubes">
    <span class="bubble b1"></span>
    <span class="bubble b2"></span>
    <span class="bubble b3"></span>
  </div>
  <div class="laser-blast">
    <div class="laser-core"></div>
    <div class="laser-flare"></div>
    <div class="sterile-mist">
      <span class="mist-cloud m1"></span>
      <span class="mist-cloud m2"></span>
      <span class="mist-cloud m3"></span>
    </div>
  </div>
  <div class="virus-shatter-zone">
    <span class="virus v1"></span>
    <span class="virus v2"></span>
    <span class="virus v3"></span>
  </div>
</div>
