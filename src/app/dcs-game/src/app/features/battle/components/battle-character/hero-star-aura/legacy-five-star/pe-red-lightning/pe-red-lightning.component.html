<div class="red-lightning-wrapper">
  <!-- Base Ground Glow -->
  <div class="electric-base"></div>

  <!-- 1. Diagonal lightning bolt (Top-Left to Bottom-Right) -->
  <svg class="bolt-svg diag-tl-br" viewBox="0 0 40 120" preserveAspectRatio="none">
    <path d="M 5 20 L 25 55 L 12 85 L 35 120" class="lightning-path"></path>
  </svg>

  <!-- 2. Diagonal lightning bolt (Top-Right to Bottom-Left) -->
  <svg class="bolt-svg diag-tr-bl" viewBox="0 0 40 120" preserveAspectRatio="none">
    <path d="M 35 20 L 15 55 L 28 85 L 5 120" class="lightning-path"></path>
  </svg>

  <!-- 3. Waist Ring Arc (Curving down across the waist) -->
  <svg class="bolt-svg waist-ring" viewBox="0 0 40 80" preserveAspectRatio="none">
    <path d="M 2 30 Q 20 60 38 30" class="lightning-path"></path>
  </svg>

  <!-- 4. Chest Ring Arc (Curving down across the chest) -->
  <svg class="bolt-svg chest-ring" viewBox="0 0 40 80" preserveAspectRatio="none">
    <path d="M 4 30 Q 20 60 36 30" class="lightning-path"></path>
  </svg>

  <!-- 5. Foot Ring Arc (Curving down across the feet) -->
  <svg class="bolt-svg foot-ring" viewBox="0 0 40 60" preserveAspectRatio="none">
    <path d="M 6 20 Q 20 45 34 20" class="lightning-path"></path>
  </svg>

  <!-- Electric Sparks -->
  <div class="sparks">
    <span class="spark spk1"></span>
    <span class="spark spk2"></span>
    <span class="spark spk3"></span>
    <span class="spark spk4"></span>
  </div>
</div>
