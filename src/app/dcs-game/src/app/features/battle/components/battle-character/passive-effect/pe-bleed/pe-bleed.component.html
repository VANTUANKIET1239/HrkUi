<div class="pe-bleed-wrapper">
  <!-- Blood puddle decal under feet -->
  <div class="bleed-puddle">
    <div class="puddle-core"></div>
    <div class="puddle-ring"></div>
    <div class="puddle-splash sp1"></div>
    <div class="puddle-splash sp2"></div>
  </div>

  <!-- Dripping blood droplets -->
  <div class="blood-drips">
    <span class="drip dr1"></span>
    <span class="drip dr2"></span>
    <span class="drip dr3"></span>
    <span class="drip dr4"></span>
  </div>

  <!-- Rising crimson mist vapor -->
  <div class="blood-mist">
    <span class="mist-particle mp1"></span>
    <span class="mist-particle mp2"></span>
    <span class="mist-particle mp3"></span>
  </div>

  <!-- Wound laceration indicator -->
  <div class="laceration-mark">
    <span class="slash-line s1"></span>
    <span class="slash-line s2"></span>
  </div>
</div>
