<div class="winter-blessings-cast-fx" [class.team-right]="isTeamRight">
  <!-- Noel's massive brown gift sack tipping over -->
  <div class="gift-sack-wrapper">
    <div class="gift-sack">
      <div class="sack-glow"></div>
      <div class="sack-icon">👜</div>
      <div class="sack-spill">🎁</div>
    </div>
  </div>

  <!-- Launching gift boxes flying upward and outwards -->
  <div class="launched-gifts">
    <img src="/assets/images/dcs-game/hopqua-bth.png" class="gift-box gb1" alt="Gift" />
    <img src="/assets/images/dcs-game/hopqua-bth.png" class="gift-box gb2" alt="Gift" />
    <img src="/assets/images/dcs-game/hopqua-bth.png" class="gift-box gb3" alt="Gift" />
  </div>

  <!-- Drifting sparkles & snowflakes around caster -->
  <div class="snow-sparkles">
    <span class="spark sp1">❄️</span>
    <span class="spark sp2">✨</span>
    <span class="spark sp3">❄️</span>
    <span class="spark sp4">✨</span>
    <span class="spark sp5">❄️</span>
  </div>
</div>
