<div class="passive-wrapper">
  <!-- Flying Money (VND 500k Bills) Status Effect -->
  <app-pe-flying-money *ngIf="hasMoneyEffect"></app-pe-flying-money>

  <!-- Dark Shield / Giáp Hư Không Status Effect -->
  <app-pe-dark-shield *ngIf="hasDarkShield"></app-pe-dark-shield>

  <!-- Bleed / Chảy Máu Status Effect -->
  <app-pe-bleed *ngIf="hasBleedEffect"></app-pe-bleed>

  <!-- Marked reticle overlay on top of the sprite -->
  <div class="marked-crosshair-overlay" *ngIf="hasMarkedEffect">
    <div class="crosshair-wrapper">
      <img src="/assets/images/dcs-game/hongtam.png" class="crosshair-img" alt="Marked" />
      <div class="crosshair-lock">LOCK</div>
    </div>
  </div>

  <!-- Dizzy effect above the character when they have Choáng Váng debuff -->
  <div class="dizzy-debuff-overlay" *ngIf="isDizzy">
    <div class="dizzy-spiral sp1"></div>
    <div class="dizzy-spiral sp2"></div>
    <div class="mini-scissor-particle ms1">✂️</div>
    <div class="mini-scissor-particle ms2">✂️</div>
  </div>

  <!-- Jackpot/Win the Gamble Gold Rain and Glow -->
  <div class="jackpot-overlay" *ngIf="isJackpot">
    <div class="golden-glowing-aura"></div>
    <div class="jackpot-win-text">JACKPOT!</div>
    <div class="gold-coin-rain">
      <span class="jc-coin c1">🪙</span>
      <span class="jc-coin c2">🎰</span>
      <span class="jc-coin c3">🪙</span>
      <span class="jc-coin c4">🎰</span>
      <span class="jc-coin c5">🪙</span>
      <span class="jc-coin c6">🪙</span>
    </div>
  </div>

  <!-- Bankruptcy/Lose the Gamble chains & lock -->
  <div class="bankruptcy-overlay" *ngIf="isBankrupt">
    <div class="dark-drain-shadow"></div>
    <div class="padlock-chains">
      <span class="padlock">🔒</span>
      <span class="padlock-chain pc-1">⛓️</span>
      <span class="padlock-chain pc-2">⛓️</span>
    </div>
  </div>

  <!-- Quà Bảo Kê / Damage Redirection Shield Matrix under feet -->
  <div class="bao-ke-overlay" *ngIf="hasBaoKeEffect">
    <div class="shield-matrix-ring"></div>
    <div class="shield-matrix-hex-grid"></div>
    <img src="/assets/images/dcs-game/hopqua-special.png" class="bao-ke-gift-box" alt="Special Gift Box" />
  </div>

  <!-- Noel's Da Thịt Vững Chãi defensive shield aura -->
  <div class="da-thit-overlay" *ngIf="hasDaThitEffect">
    <div class="defensive-aurora"></div>
    <div class="defensive-shield-badge">🛡️</div>
  </div>

  <!-- Damage Redirection Beam connecting hit target to Noel (ID 9) -->
  <div class="redirection-beam" *ngIf="isHit && hasBaoKeEffect && character.id !== 9">
    <div class="beam-line"></div>
    <div class="beam-energy-pulse"></div>
  </div>

  <!-- Deadlift Dia Chan Kinetic Dome Shield & Rotating Weight Plates -->
  <div class="deadlift-shield-overlay" *ngIf="hasDeadliftShield">
    <div class="kinetic-dome"></div>
    <div class="rotating-weight-plates">
      <span class="plate p-left">🏋️</span>
      <span class="plate p-right">🏋️</span>
      <span class="plate p-center">🏋️</span>
    </div>
    <!-- Electric sparks if "Khóa Khớp" is active -->
    <div class="joint-lock-sparks" *ngIf="hasJointLock">
      <span class="spark s1">⚡</span>
      <span class="spark s2">⚡</span>
      <span class="spark s3">⚡</span>
    </div>
  </div>

  <!-- Long Lê Cat Companion (cute feline bodyguard beside ally, mirrored for right team) -->
  <div class="cat-companion-wrapper" *ngIf="hasCatCompanion" [class.team-right]="character.team === 'right'">
    <img
      src="/assets/images/dcs-game/skill-vfx/long-le-cat/cat-companion.png"
      class="cat-companion-sprite-img"
      alt="Guardian Cat Companion"
    />
    <div class="cat-companion-aura-halo"></div>
  </div>

  <!-- Cat Scratch (3 vibrant yellow claw cuts using cat-scratch.png) -->
  <div class="cat-scratch-overlay normal-scratch" *ngIf="hasCatScratch && !hasDeepCatScratch">
    <img
      src="/assets/images/dcs-game/effects/cat-scratch.png"
      class="cat-scratch-img"
      alt="Cat Scratch"
    />
    <div class="scratch-pulse-halo"></div>
  </div>

  <!-- Deep Cat Scratch (3 intense crimson gouging claws using deep-cat-scratch.png) -->
  <div class="cat-scratch-overlay deep-scratch" *ngIf="hasDeepCatScratch">
    <img
      src="/assets/images/dcs-game/effects/deep-cat-scratch.png"
      class="deep-scratch-img"
      alt="Deep Cat Scratch"
    />
    <div class="deep-scratch-pulse-halo"></div>
  </div>

  <!-- Chạy Ngay Đi (Candle wax mark and thin black smoke at feet) -->
  <div class="chay-ngay-di-ground-fx" *ngIf="hasChayNgayDi">
    <div class="candle-halo"></div>
    <img
      src="/assets/images/dcs-game/skill-vfx/quoc-nhan-run-now/red-wax-mark.png"
      class="chay-ngay-di-wax-img"
      alt="Chay Ngay Di Mark"
    />
    <div class="candle-smoke"></div>
  </div>

  <!-- Silence Status Seal (above head, not covering face) -->
  <div class="academic-silence-lock-overlay" *ngIf="hasSilenceEffect">
    <div class="silence-rune-lock"></div>
  </div>

  <!-- Damage Reduction Lingering Aura -->
  <div class="graduation-dr-barrier-overlay" *ngIf="hasDamageReductionEffect">
    <div class="dr-radiant-shield"></div>
  </div>

  <!-- Stack badges above hero: Phong Ấn, Tín Chỉ, Luận Điểm (No emojis!) -->
  <div class="legendary-stack-row phong-an-row" *ngIf="phongAnStacks > 0">
    <div *ngFor="let s of [1,2,3]" class="wind-seal-sigil" [class.active]="s <= phongAnStacks" [class.tier-1]="s === 1" [class.tier-2]="s === 2" [class.tier-3]="s === 3">
      <div class="sigil-core"></div>
    </div>
  </div>
  <div class="legendary-stack-row tin-chi-row" *ngIf="tinChiStacks > 0">
    <div *ngFor="let s of [1,2,3]" class="honor-credit-sigil" [class.active]="s <= tinChiStacks">
      <div class="credit-crest-box"></div>
      <div class="stamp-gold-flash" *ngIf="s === tinChiStacks"></div>
    </div>
  </div>
  <div class="legendary-stack-row luan-diem-row" *ngIf="luanDiemStacks > 0">
    <div *ngFor="let s of [1,2,3]" class="thesis-point-sigil" [class.active]="s <= luanDiemStacks" [class.tier-1]="s === 1" [class.tier-2]="s === 2" [class.tier-3]="s === 3">
      <div class="thesis-ring-layer"></div>
    </div>
  </div>
  <!-- Cracked Magic Barrier when 3 Luận Điểm stacks active -->
  <div class="cracked-purple-barrier-overlay" *ngIf="luanDiemStacks >= 3">
    <div class="cracked-hex-grid"></div>
  </div>
</div>
