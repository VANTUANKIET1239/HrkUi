<div class="scorched-earth-aura">
  <!-- 1. Faint tactical radar grid/crosshairs expanding at feet -->
  <div class="command-grid">
    <div class="grid-line horizontal"></div>
    <div class="grid-line vertical"></div>
    <div class="grid-ring r1"></div>
    <div class="grid-ring r2"></div>
  </div>

  <!-- 2. Roaring tactical fire surrounding his feet and rising upward -->
  <div class="tactical-ground-flames">
    <span class="flame fl1"></span>
    <span class="flame fl2"></span>
    <span class="flame fl3"></span>
    <span class="flame fl4"></span>
    <span class="flame fl5"></span>
    <span class="flame fl6"></span>
  </div>

  <!-- 3. Heavy, curling plumes of matte-black smoke at the edges -->
  <div class="smoke-plumes">
    <span class="smoke-cloud sm1"></span>
    <span class="smoke-cloud sm2"></span>
    <span class="smoke-cloud sm3"></span>
    <span class="smoke-cloud sm4"></span>
  </div>

  <!-- 4. Sharp, high-visibility embers and military-gold sparks drifting upward -->
  <div class="embers-sparks">
    <span class="particle spark s1"></span>
    <span class="particle spark s2"></span>
    <span class="particle spark s3"></span>
    <span class="particle spark s4"></span>
    <span class="particle ember em1"></span>
    <span class="particle ember em2"></span>
    <span class="particle ember em3"></span>
    <span class="particle ember em4"></span>
  </div>

  <!-- 5. Orbiting mini tactical energy missiles -->
  <div class="orbiting-missiles">
    <div class="mini-missile mm1">
      <div class="missile-glow"></div>
      <div class="missile-body"></div>
      <div class="missile-head"></div>
      <div class="missile-fins"></div>
      <div class="missile-trail"></div>
    </div>
    <div class="mini-missile mm2">
      <div class="missile-glow"></div>
      <div class="missile-body"></div>
      <div class="missile-head"></div>
      <div class="missile-fins"></div>
      <div class="missile-trail"></div>
    </div>
    <div class="mini-missile mm3">
      <div class="missile-glow"></div>
      <div class="missile-body"></div>
      <div class="missile-head"></div>
      <div class="missile-fins"></div>
      <div class="missile-trail"></div>
    </div>
    <div class="mini-missile mm4">
      <div class="missile-glow"></div>
      <div class="missile-body"></div>
      <div class="missile-head"></div>
      <div class="missile-fins"></div>
      <div class="missile-trail"></div>
    </div>
  </div>
</div>
