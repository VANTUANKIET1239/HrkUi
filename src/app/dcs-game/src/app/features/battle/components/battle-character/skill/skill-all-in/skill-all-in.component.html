<div class="all-in-cast-fx" [class.team-right]="isTeamRight">
  <!-- Glowing / Slamming Smartphone representing 'All-In' -->
  <div class="phone-cast-wrapper">
    <div class="smartphone-all-in">
      <div class="screen-glow"></div>
      <div class="all-in-text">ALL IN</div>
      
      <!-- Electric surges around phone screen -->
      <div class="electric-surges">
        <span class="surge sg1">⚡</span>
        <span class="surge sg2">⚡</span>
        <span class="surge sg3">⚡</span>
      </div>
    </div>
  </div>

  <!-- Flashing neon 'NỢ' symbols surrounding caster -->
  <div class="flashing-aura">
    <span class="flashing-debt fd1">NỢ</span>
    <span class="flashing-debt fd2">NỢ</span>
    <span class="flashing-debt fd3">NỢ</span>
    <span class="flashing-debt fd4">NỢ</span>
    
    <!-- Red -20% / -15% stock market indicators -->
    <span class="flashing-stock fs1">-20%</span>
    <span class="flashing-stock fs2">-15%</span>
    <span class="flashing-stock fs3">📉</span>
    <span class="flashing-stock fs4">📉</span>
  </div>
</div>
