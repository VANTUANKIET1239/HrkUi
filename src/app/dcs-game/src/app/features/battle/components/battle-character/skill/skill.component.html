<ng-container *ngIf="isCharging">
  <!-- Active selection ring (base color matching skill) -->
  <div class="active-ring" [style.--skill-color]="skillColor"></div>

  <!-- Skill 1: Basic Skill Visuals (Cast Phase) -->
  <app-basic-skill-effect 
    *ngIf="(skillCategory === 'basic' || activeSkillId === 'NORMAL_ATTACK' || activeSkillId === 'BASIC_RANDOM_HEAL') && activeSkillId !== 'VAX_A_MILLION_SANITZATION'"
    [character]="character"
    [activeSkillId]="activeSkillId"
    [phase]="'cast'"
    [isTeamRight]="isTeamRight">
  </app-basic-skill-effect>

  <!-- Skill 2: Rage Burst Visuals -->
  <app-skill-rage *ngIf="skillCategory === 'rage' && activeSkillId !== 'VAX_A_MILLION_SANITZATION'"></app-skill-rage>

  <!-- Skill 3: Thunder Execution Visuals -->
  <app-skill-thunder *ngIf="skillCategory === 'thunder' && activeSkillId !== 'VAX_A_MILLION_SANITZATION'"></app-skill-thunder>

  <!-- Ultimate: Berserker Overload Visuals -->
  <app-skill-ultimate 
    *ngIf="skillCategory === 'ultimate' && activeSkillId !== 'VAX_A_MILLION_SANITZATION' && activeSkillId !== 'RICARDO_MILOS' && activeSkillId !== 'RANDOM_KNOWLEDGE_DROP' && activeSkillId !== 'DARK_KNOWLEDGE_SHIELD_CONVERSION' && activeSkillId !== 'TACTICAL_AIR_STRIKE' && activeSkillId !== 'DOI_NGOI_DAU_DOC' && activeSkillId !== 'FATAL_ALL_IN_DIRECTIVE' && activeSkillId !== 'HAI_LAST_LAUGH'"
    [characterAvatar]="character.avatar"
    [isTeamRight]="isTeamRight">
  </app-skill-ultimate>

  <!-- Skill 5: Heavenly Shirtless Judgment Visuals -->
  <app-skill-heavenly *ngIf="skillCategory === 'heavenly' && activeSkillId !== 'VAX_A_MILLION_SANITZATION'"></app-skill-heavenly>

  <!-- Skill: Vax-A-Million Sanitization Beam Effect (Nam Deadline's Linear AoE) -->
  <app-skill-vax-a-million-sanitization 
    *ngIf="activeSkillId === 'VAX_A_MILLION_SANITZATION'"
    [isTeamRight]="isTeamRight">
  </app-skill-vax-a-million-sanitization>

  <!-- Skill: Ricardo Milos! (Humorous Crimson Red Dance / Empowered Celestial Descent) -->
  <app-skill-ricardo-milos
    *ngIf="activeSkillId === 'RICARDO_MILOS'"
    [style.--visual-speed]="visualSpeed"
    [isTeamRight]="isTeamRight"
    [empowered]="isEmpowered"
    [phase]="phase"
    [visualSpeed]="visualSpeed"
    [castSequence]="castSequence">
  </app-skill-ricardo-milos>

  <!-- Skill: Random Knowledge Drop (Giant Textbook Drop) -->
  <app-skill-random-knowledge-drop
    *ngIf="activeSkillId === 'RANDOM_KNOWLEDGE_DROP'">
  </app-skill-random-knowledge-drop>

  <!-- Skill: Dark Knowledge: Shield Conversion (Giáp Hư Không) -->
  <app-skill-dark-knowledge
    *ngIf="activeSkillId === 'DARK_KNOWLEDGE_SHIELD_CONVERSION'">
  </app-skill-dark-knowledge>

  <!-- Skill: Tactical Air Strike (Oanh Tạc Hàng Sau) -->
  <app-skill-tactical-air-strike
    *ngIf="activeSkillId === 'TACTICAL_AIR_STRIKE'"
    [isTeamRight]="isTeamRight">
  </app-skill-tactical-air-strike>

  <!-- Skill: Đổi Ngôi Đầu Độc (Position Snipping) -->
  <app-skill-position-snipping
    *ngIf="activeSkillId === 'DOI_NGOI_DAU_DOC'"
    [isTeamRight]="isTeamRight">
  </app-skill-position-snipping>

  <!-- Skill: Lệnh All-In Hủy Diệt (Fatal All-In Directive) -->
  <app-skill-all-in
    *ngIf="activeSkillId === 'FATAL_ALL_IN_DIRECTIVE'"
    [isTeamRight]="isTeamRight">
  </app-skill-all-in>

  <!-- Skill: Quà Tặng Đêm Đông (Winter Night Blessings) -->
  <app-skill-winter-blessings
    *ngIf="activeSkillId === 'WINTER_NIGHT_BLESSINGS'"
    [isTeamRight]="isTeamRight">
  </app-skill-winter-blessings>

  <!-- Skill: Deadlift Địa Chấn (Deadlift Dia Chan) -->
  <app-skill-deadlift-dia-chan
    *ngIf="activeSkillId === 'DEADLIFT_DIA_CHAN'"
    [isTeamRight]="isTeamRight">
  </app-skill-deadlift-dia-chan>

  <!-- Skill: Cười Đi, Sắp Hết Lượt Rồi (Hai Last Laugh) -->
  <app-skill-hai-last-laugh
    *ngIf="activeSkillId === 'HAI_LAST_LAUGH'"
    [isTeamRight]="isTeamRight"
    [character]="character">
  </app-skill-hai-last-laugh>
</ng-container>
