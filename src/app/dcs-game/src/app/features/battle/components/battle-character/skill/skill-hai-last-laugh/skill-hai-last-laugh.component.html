<div
  class="hai-caster-vfx-root"
  [class.team-right]="isTeamRight"
  [class.is-dashing]="isDashingOut"
  [class.is-reappearing]="isReappearing">

  <!-- ======================================================== -->
  <!-- 1. TECH RUNE CIRCLE UNDER CASTER'S FEET                  -->
  <!-- ======================================================== -->
  <div class="foot-tech-circle" *ngIf="!isDashingOut">
    <div class="rune-ring ring-1"></div>
    <div class="rune-ring ring-2"></div>
    <div class="rune-glyphs">
      <span class="glyph g1">᚛</span>
      <span class="glyph g2">ᚚ</span>
      <span class="glyph g3">ᚐ</span>
      <span class="glyph g4">ᚑ</span>
    </div>
  </div>

  <!-- ======================================================== -->
  <!-- 2. RISING CYAN PARTICLES FROM BELOW                      -->
  <!-- ======================================================== -->
  <div class="rising-particles-container" *ngIf="!isDashingOut">
    <span class="r-particle rp1"></span>
    <span class="r-particle rp2"></span>
    <span class="r-particle rp3"></span>
    <span class="r-particle rp4"></span>
    <span class="r-particle rp5"></span>
    <span class="r-particle rp6"></span>
  </div>

  <!-- ======================================================== -->
  <!-- 3. TWIN LATERAL SHADOW AFTERIMAGES (10-18px offset)     -->
  <!-- ======================================================== -->
  <div class="lateral-shadows" *ngIf="!isDashingOut">
    <div class="shadow-ghost ghost-left"></div>
    <div class="shadow-ghost ghost-right"></div>
  </div>

  <!-- ======================================================== -->
  <!-- 4. CYBER EYE FLARE & KNIFE ELECTRIC PULSE                -->
  <!-- ======================================================== -->
  <div class="caster-charge-details" *ngIf="!isDashingOut">
    <!-- Cyan Eyes Flare -->
    <div class="cyan-eye-flare">
      <span class="eye-spark e-l"></span>
      <span class="eye-spark e-r"></span>
    </div>

    <!-- Knife Electric Pulse -->
    <div class="knife-electric-pulse">
      <div class="pulse-line"></div>
    </div>
  </div>

  <!-- ======================================================== -->
  <!-- 5. CRISP CYBER HOLOGRAM SMILE BEHIND HEAD                -->
  <!-- ======================================================== -->
  <div class="hologram-smile-wrapper" *ngIf="!isDashingOut">
    <svg viewBox="0 0 64 36" class="holo-smile-svg">
      <!-- Cyber Curved Smile Arc -->
      <path d="M 8,8 Q 32,32 56,8" class="smile-arc-glow" />
      <path d="M 8,8 Q 32,32 56,8" class="smile-arc-core" />
      <!-- Sharp Stylized Cyber Teeth -->
      <path d="M 18,17 L 22,23 L 26,17 M 28,21 L 32,27 L 36,21 M 38,17 L 42,23 L 46,17" class="teeth-stroke" />
    </svg>
    <div class="holo-flicker-halo"></div>
  </div>

  <!-- ======================================================== -->
  <!-- 6. SHORT HOLOGRAPHIC QUOTE BUBBLE                        -->
  <!-- ======================================================== -->
  <div class="quote-callout-bubble" *ngIf="quoteState !== 'hidden' && !isDashingOut">
    <div class="bubble-frame">
      <span class="quote-text" *ngIf="quoteState === 'quote1'">“Cười đi…”</span>
      <span class="quote-text" *ngIf="quoteState === 'quote2'">“Vì sắp hết lượt rồi.”</span>
    </div>
  </div>

  <!-- ======================================================== -->
  <!-- 7. REAPPEARANCE FLASH & SHEATHING                        -->
  <!-- ======================================================== -->
  <div class="reappearance-vfx" *ngIf="isReappearing">
    <div class="origin-reappear-flare"></div>
    <div class="sheath-sparkle"></div>
  </div>

</div>
