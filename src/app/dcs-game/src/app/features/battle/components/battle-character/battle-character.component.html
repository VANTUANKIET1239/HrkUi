<div class="character-sprite-wrapper" [ngClass]="{
    'team-left': character.team === 'left',
    'team-right': character.team === 'right',
    'is-charging': isCharging,
    'is-hit': isHit,
    'is-dead': character.hp <= 0
  }" [attr.active-skill-id]="activeSkillId">


  <!-- ACTIVE SKILL EFFECTS (Casting / Attacking state) -->
  <app-skill [isCharging]="isCharging" [skillCategory]="getSkillCategory()" [skillColor]="skillColor"
    [activeSkillId]="activeSkillId" [character]="character">
  </app-skill>

  <!-- HIT / IMPACT EFFECTS (When receiving damage) -->
  <ng-container *ngIf="isHit">
    <div class="impact-flash"></div>
    <div class="impact-sparks">
      <span class="spk sp1"></span>
      <span class="spk sp2"></span>
      <span class="spk sp3"></span>
      <span class="spk sp4"></span>
    </div>
    <div class="slash-burst"></div>

    <!-- Critical Explosion visual -->
    <div class="crit-explosion" *ngIf="damageEvent?.isCrit">
      <div class="crit-shockwave"></div>
      <div class="crit-flash"></div>
    </div>

    <!-- Heavenly Judgment Hit Visuals -->
    <div class="heavenly-judgment-hit-fx" *ngIf="activeSkillId === 'HEAVENLY_JUDGMENT'">
      <div class="heavenly-rune-circle"></div>
      <div class="heavenly-thunder-pillars">
        <div class="pillar p1"></div>
        <div class="pillar p2"></div>
        <div class="pillar p3"></div>
      </div>
      <div class="heavenly-cracks"></div>
      <div class="heavenly-debris">
        <span class="debris-stone ds1"></span>
        <span class="debris-stone ds2"></span>
        <span class="debris-stone ds3"></span>
      </div>
      <div class="chain-lightning-overlay"></div>
      <div class="burning-electric-particles">
        <span class="sparkle spk1"></span>
        <span class="sparkle spk2"></span>
        <span class="sparkle spk3"></span>
        <span class="sparkle spk4"></span>
      </div>
    </div>

    <!-- Random Knowledge Drop Hit Visuals -->
    <div class="knowledge-drop-hit-fx" *ngIf="activeSkillId === 'RANDOM_KNOWLEDGE_DROP'">
      <!-- Targeting Reticle -->
      <div class="targeting-reticle">
        <div class="reticle-ring r-outer"></div>
        <div class="reticle-ring r-inner"></div>
        <div class="reticle-crosshair"></div>
        <div class="reticle-lock">LOCK-ON</div>
      </div>

      <!-- Cyber Magic Circle Portal -->
      <div class="matrix-portal"></div>

      <!-- Giant Textbook falling -->
      <div class="falling-book-wrapper">
        <img src="/assets/images/dcs-game/sach.png" class="falling-book" alt="Book of Knowledge" />
      </div>

      <!-- Impact Shards & Pages Shattering -->
      <div class="shatter-fx">
        <!-- Flying pages -->
        <span class="fly-page fg1"></span>
        <span class="fly-page fg2"></span>
        <span class="fly-page fg3"></span>
        <span class="fly-page fg4"></span>
        <span class="fly-page fg5"></span>
        <span class="fly-page fg6"></span>

        <!-- Glowing paper scraps -->
        <span class="scrap sc1"></span>
        <span class="scrap sc2"></span>
        <span class="scrap sc3"></span>
        <span class="scrap sc4"></span>
        <span class="scrap sc5"></span>
        <span class="scrap sc6"></span>

        <!-- Blue cyber matrix fragments -->
        <span class="matrix-shard ms1"></span>
        <span class="matrix-shard ms2"></span>
        <span class="matrix-shard ms3"></span>
        <span class="matrix-shard ms4"></span>
        <span class="matrix-shard ms5"></span>
        <span class="matrix-shard ms6"></span>
      </div>

      <!-- Blue shockwave ring -->
      <div class="blue-impact-wave"></div>
    </div>

    <!-- Tactical Air Strike Impact Explosion Visuals (Nuclear Mushroom Cloud) -->
    <div class="mushroom-explosion-fx" *ngIf="activeSkillId === 'TACTICAL_AIR_STRIKE'">
      <!-- Screen/Scene Flash -->
      <div class="nuclear-flash"></div>

      <!-- Ground dust/smoke wave rolling outward -->
      <div class="ground-dust-wave">
        <span class="dust d1"></span>
        <span class="dust d2"></span>
        <span class="dust d3"></span>
        <span class="dust d4"></span>
      </div>

      <!-- Ground cracks -->
      <div class="strike-cracks"></div>

      <!-- The rising column/stem of the mushroom cloud -->
      <div class="mushroom-stem">
        <div class="stem-column"></div>
        <div class="stem-fire"></div>
      </div>

      <!-- The massive glowing dome/cap at the top -->
      <div class="mushroom-cap">
        <div class="cap-fireball outer"></div>
        <div class="cap-fireball inner"></div>
        <div class="cap-fireball core"></div>
        <div class="cap-smoke"></div>
      </div>

      <!-- Expanding condensation ring (torus/halo) -->
      <div class="condensation-ring"></div>

      <!-- Flying glowing embers and shrapnel -->
      <div class="nuclear-embers">
        <span class="ember em1"></span>
        <span class="ember em2"></span>
        <span class="ember em3"></span>
        <span class="ember em4"></span>
        <span class="ember em5"></span>
        <span class="ember em6"></span>
      </div>
    </div>

    <!-- Position Snipping Hit Visuals (Đổi Ngôi Đầu Độc) -->
    <div class="position-snipping-hit-fx" *ngIf="activeSkillId === 'DOI_NGOI_DAU_DOC'">
      <!-- Hair clip targeting reticle -->
      <div class="hair-clip-reticle">
        <div class="clip-prong pr1"></div>
        <div class="clip-prong pr2"></div>
      </div>

      <!-- Slicing matrix lines -->
      <div class="snipping-slice-line"></div>

      <!-- Comical Snip! Snip! scissor animation overlays -->
      <div class="snip-shears-container">
        <div class="snip-glow"></div>
        <div class="snip-blade blade-a"></div>
        <div class="snip-blade blade-b"></div>
        <div class="snip-label">Snip! Snip!</div>
      </div>

      <!-- Barber energy cyclone (Green & Purple) during swap -->
      <div class="barber-energy-cyclone">
        <div class="cyclone-aura green-aura"></div>
        <div class="cyclone-aura purple-aura"></div>
        <!-- Lightning particles -->
        <span class="lightning lt1">⚡</span>
        <span class="lightning lt2">⚡</span>
        <span class="lightning lt3">⚡</span>
        <!-- Swirling tools -->
        <span class="cyclone-tool ct1">✂️</span>
        <span class="cyclone-tool ct2">🪮</span>
        <span class="cyclone-tool ct3">💈</span>
      </div>

      <!-- Warp space sphere -->
      <div class="space-warp-ripple"></div>
    </div>

    <!-- Lệnh All-In Hủy Diệt Hit Visuals (Fatal All-In Directive) -->
    <div class="all-in-hit-fx" *ngIf="activeSkillId === 'FATAL_ALL_IN_DIRECTIVE'">
      <!-- 1. Holographic Casino Matrix grid under target feet -->
      <div class="casino-matrix-field">
        <div class="matrix-grid"></div>
        <div class="matrix-circle"></div>
      </div>

      <!-- 2. Massive energy pillars of crimson & blue lightning -->
      <div class="all-in-lightning-pillars">
        <div class="lightning-pillar crimson-pillar"></div>
        <div class="lightning-pillar blue-pillar"></div>
      </div>

      <!-- 3. Bursting card shards, dice, red stock market candles -->
      <div class="all-in-burst-debris">
        <span class="deb card-shard cs1">🃏</span>
        <span class="deb card-shard cs2">🂾</span>
        <span class="deb card-shard cs3">🃟</span>

        <span class="deb dice-shard ds1">🎲</span>
        <span class="deb dice-shard ds2">⚅</span>

        <span class="deb stock-candle sc1">📉</span>
        <span class="deb stock-candle sc2">-20%</span>
        <span class="deb stock-candle sc3">📉</span>
      </div>
    </div>

    <!-- Winter Blessings target-side hit animation (gift box landing and healing burst) -->
    <div class="winter-blessings-hit-fx" *ngIf="activeSkillId === 'WINTER_NIGHT_BLESSINGS'">
      <!-- Flying gift box: special box if receiving "Quà Bảo Kê" buff, standard box otherwise -->
      <div class="flying-box-wrapper">
        <img
          [src]="hasBaoKeEffect() ? '/assets/images/dcs-game/hopqua-special.png' : '/assets/images/dcs-game/hopqua-bth.png'"
          class="landing-gift-box" [class.special-box]="hasBaoKeEffect()" alt="Gift Box" />
      </div>

      <!-- Healing burst vfx (glowing rings and sparkles) -->
      <div class="healing-burst-vfx">
        <div class="healing-ring-blue"></div>
        <div class="healing-ring"></div>
        <div class="healing-glow"></div>
        <div class="healing-sparkles">
          <span class="h-spark hs1">➕</span>
          <span class="h-spark hs2">➕</span>
          <span class="h-spark hs3">➕</span>
          <span class="h-spark hs4">➕</span>
          <span class="h-spark hs5">➕</span>
        </div>
      </div>
    </div>

    <!-- Deadlift Dia Chan target-side hit animation (barbell slam + light blades + earth cracks + taunt) -->
    <div class="deadlift-dia-chan-hit-fx" *ngIf="activeSkillId === 'DEADLIFT_DIA_CHAN'">

      <!-- Incoming Barbell Projectiles (fly in from caster direction) -->
      <div class="deadlift-barbell-volley">
        <span class="barbell bb1">🏋️</span>
        <span class="barbell bb2">🏋️</span>
        <span class="barbell bb3">🏋️</span>
      </div>

      <!-- Light Sword Slash Beams (diagonal golden + red light blades) -->
      <div class="light-blade-slash-fx">
        <div class="light-blade lb1"></div>
        <div class="light-blade lb2"></div>
        <div class="light-blade lb3"></div>
        <div class="blade-impact-burst"></div>
      </div>

      <!-- Seismic Ground Shatter on impact -->
      <div class="deadlift-ground-shatter">
        <div class="shatter-ring sr1"></div>
        <div class="shatter-ring sr2"></div>
        <div class="shatter-ring sr3"></div>
        <span class="debris-chunk dk1"></span>
        <span class="debris-chunk dk2"></span>
        <span class="debris-chunk dk3"></span>
        <span class="debris-chunk dk4"></span>
      </div>

      <!-- Earth cracks under feet -->
      <div class="earthquake-cracks">
        <div class="crack c1"></div>
        <div class="crack c2"></div>
        <div class="crack c3"></div>
      </div>

      <!-- Angry vein icons and red TAUNTED text floating above head -->
      <div class="taunted-float">
        <span class="angry-vein av1">💢</span>
        <span class="angry-vein av2">💢</span>
        <div class="taunted-banner">TAUNTED!</div>
      </div>

      <!-- Forced Target Lock-on Reticle overlay -->
      <div class="taunt-target-reticle">
        <div class="t-ring"></div>
        <div class="t-cross"></div>
        <div class="t-lock">LOCK</div>
      </div>
    </div>
  </ng-container>

  <!-- Ellipse shadow under feet -->
  <div class="shadow-ellipse"></div>

  <!-- Orange grid plate highlight (Vinh Barber swap) -->
  <div class="position-snipping-grid-plate" *ngIf="activeSkillId === 'DOI_NGOI_DAU_DOC'">
    <div class="plate-border"></div>
    <div class="plate-text">{{ getRowLabel() }}</div>
  </div>

  <!-- Sprite area -->
  <div class="sprite-area">
    <!-- PASSIVE EFFECTS (Ambient) - Moved inside sprite-area to center relative to character feet and not overlap health bars -->
    <app-passive-effect *ngIf="character.hp > 0" [character]="character" [level]="character.level || 1"
      [hasMoneyEffect]="hasMoneyEffect()" [hasRedLightning]="hasRedLightningEffect()"
      [hasObsidianNebula]="hasObsidianNebulaEffect()" [hasDarkShield]="hasDarkShieldEffect()"
      [hasScorchedEarth]="hasScorchedEarthEffect()" [hasSpectralGrooming]="hasSpectralGroomingEffect()"
      [hasViciousDebt]="hasViciousDebtEffect()" [isHit]="isHit">
    </app-passive-effect>

    <img [src]="character.avatar" [alt]="character.name" class="character-sprite"
      [class.sprite-flipped]="shouldFlipSprite()" />

    <!-- Status effects/Buff badges overlaying above the head -->
    <div class="status-badge-overlay" *ngIf="displayMode === 'battle' && character.statusEffects?.length">
      <span *ngFor="let effect of character.statusEffects" class="status-badge" [ngClass]="{
          'effect-dead': effect === 'Dead', 
          'effect-buff': effect !== 'Dead'
        }">
        {{ effect }}
      </span>
    </div>
  </div>

  <!-- Info Overlay (Name & Health / Mana) -->
  <div class="info-block" *ngIf="displayMode === 'battle'">
    <div class="name-tag">{{ character.name }}</div>
    <div class="bars-container">
      <app-hp-bar [hp]="character.hp" [maxHp]="character.maxHp"></app-hp-bar>
      <app-mana-bar [mana]="character.mana" [maxMana]="character.maxMana"></app-mana-bar>
    </div>
  </div>

  <!-- Floating Damage Text Layer -->
  <div *ngIf="damageEvent" class="damage-text-layer"
    [ngClass]="{ 'is-crit': damageEvent.isCrit, 'is-heal': damageEvent.text.startsWith('+') }">
    {{ damageEvent.text }}
  </div>
</div>
