<div class="lobby-container">
  <!-- Top Bar: Player Profile and Currencies -->
  <div class="top-bar d-flex justify-content-between align-items-start">
    
    <!-- A. Player Profile (Top-Left UI) -->
    <div class="player-profile d-flex align-items-center">
      <div class="avatar-container position-relative">
        <div class="avatar-frame">
          <!-- Stylized Avatar (using SVG or clean letters/icon since we want it visual) -->
          <div class="avatar-img-placeholder d-flex align-items-center justify-content-center">
            <i class="bi bi-person-circle text-warning fs-1"></i>
          </div>
          <span class="level-badge">120</span>
        </div>
        <div class="vip-badge">VIP 10</div>
      </div>
      
      <div class="player-details ms-2">
        <div class="player-name text-truncate">{{ playerInfo.name }}</div>
        <div class="player-power d-flex align-items-center">
          <span class="label">C.Lực</span>
          <span class="value">{{ playerInfo.power }}</span>
        </div>
        <div class="player-actions d-flex mt-1">
          <button class="btn btn-sm btn-nap me-1" (click)="buyDiamonds()">Nạp</button>
          <button class="btn btn-sm btn-achievement d-flex align-items-center" (click)="onFeatureClick({name: 'Thành tựu', icon: '', hasNotification: false})">
            <i class="bi bi-trophy-fill text-warning me-1"></i>
            <span class="ach-text">Thành tựu</span>
          </button>
        </div>
      </div>
    </div>

    <!-- B. Currency & Resources (Top-Right UI) -->
    <div class="currency-group d-flex align-items-center">
      <!-- Stamina (Bread) -->
      <div class="currency-item d-flex align-items-center me-2">
        <div class="icon-bg d-flex align-items-center justify-content-center">
          <i class="bi bi-egg-fried text-warning"></i>
        </div>
        <span class="currency-value">{{ playerInfo.stamina }}/{{ playerInfo.maxStamina }}</span>
        <button class="btn btn-add" (click)="buyStamina()">+</button>
      </div>

      <!-- Gold (Xu) -->
      <div class="currency-item d-flex align-items-center me-2">
        <div class="icon-bg d-flex align-items-center justify-content-center">
          <i class="bi bi-coin text-warning"></i>
        </div>
        <span class="currency-value">{{ playerInfo.gold }}</span>
        <button class="btn btn-add" (click)="buyGold()">+</button>
      </div>

      <!-- Diamond (KNB) -->
      <div class="currency-item d-flex align-items-center">
        <div class="icon-bg d-flex align-items-center justify-content-center">
          <i class="bi bi-gem text-info"></i>
        </div>
        <span class="currency-value">{{ playerInfo.diamond }}</span>
        <button class="btn btn-add" (click)="buyDiamonds()">+</button>
      </div>
    </div>
  </div>

  <!-- C. Events & Benefits (Under Currency Group - Top Right events) -->
  <div class="event-bar-container d-flex flex-column align-items-end">
    <div class="event-bar d-flex align-items-center">
      <div 
        *ngFor="let item of topEvents" 
        class="event-btn position-relative d-flex flex-column align-items-center"
        (click)="onFeatureClick(item)">
        <div class="event-icon-circle d-flex align-items-center justify-content-center">
          <i class="bi {{ item.icon }} text-white"></i>
        </div>
        <span class="event-name">{{ item.name }}</span>
        <!-- Pulse notification badge -->
        <span *ngIf="item.hasNotification" class="notification-badge"></span>
      </div>
      
      <!-- Open/close more button -->
      <div class="event-btn d-flex flex-column align-items-center" (click)="toggleMoreMenu()">
        <div class="event-icon-circle more-btn d-flex align-items-center justify-content-center">
          <i class="bi" [ngClass]="showMoreMenu ? 'bi-dash' : 'bi-plus'"></i>
        </div>
        <span class="event-name">THÊM</span>
        <span class="notification-badge"></span>
      </div>
    </div>
  </div>

  <!-- D. Showcase Team (Center Area) -->
  <div class="showcase-team d-flex justify-content-center align-items-end">
    <div 
      *ngFor="let hero of mainTeam; let i = index" 
      class="hero-showcase position-relative d-flex flex-column align-items-center hero-float-{{i % 3}}">
      
      <!-- Hover Card Information -->
      <div class="hero-header-tag text-center">
        <span class="hero-level">Lv{{ hero.level }}</span>
        <span class="hero-name">{{ hero.name }}</span>
      </div>
      
      <!-- Hero Body Illustration (Stylized using CSS gradients and glowing effects representing heroes) -->
      <div class="hero-character-body" [style.background]="'linear-gradient(to top, ' + hero.color + ', transparent)'">
        <div class="hero-silhouette d-flex align-items-center justify-content-center">
          <!-- Icon representing hero character type -->
          <i class="bi" [ngClass]="{
            'bi-shield-fill-check': i === 0,
            'bi-swords': i === 1,
            'bi-lightning-fill': i === 2,
            'bi-fire': i === 3,
            'bi-heart-fill': i === 4
          }"></i>
        </div>
        <div class="hero-role-tag">{{ hero.role }}</div>
      </div>
      
      <!-- Hero Pedestal / Reflection Shadow -->
      <div class="hero-shadow"></div>
    </div>
  </div>

  <!-- Side buttons (Chat / 18+ badge) -->
  <div class="side-badges position-absolute">
    <div class="age-badge d-flex align-items-center justify-content-center mb-2">18+</div>
    <button class="btn btn-chat d-flex align-items-center justify-content-center">
      <i class="bi bi-chat-dots-fill text-white fs-4"></i>
    </button>
  </div>

  <!-- E. Bottom Navigation Menu (Bottom UI) -->
  <div class="bottom-navigation-container">
    <div class="bottom-navigation d-flex justify-content-between align-items-end px-3 pb-2">
      
      <!-- Left Features Section -->
      <div class="nav-group-left d-flex flex-wrap align-items-center">
        <div 
          *ngFor="let item of bottomFeaturesLeft" 
          class="nav-item position-relative d-flex flex-column align-items-center"
          (click)="onFeatureClick(item)">
          <div class="nav-icon-box d-flex align-items-center justify-content-center">
            <i class="bi {{ item.icon }}"></i>
          </div>
          <span class="nav-name">{{ item.name }}</span>
          <span *ngIf="item.hasNotification" class="notification-badge"></span>
        </div>
      </div>

      <!-- Right Feature and Focused "Chính Tuyến" Button -->
      <div class="nav-group-right d-flex align-items-end">
        <!-- Regular right features -->
        <div 
          *ngFor="let item of bottomFeaturesRight" 
          class="nav-item position-relative d-flex flex-column align-items-center me-2"
          (click)="onFeatureClick(item)">
          <div class="nav-icon-box d-flex align-items-center justify-content-center">
            <i class="bi {{ item.icon }}"></i>
          </div>
          <span class="nav-name">{{ item.name }}</span>
          <span *ngIf="item.hasNotification" class="notification-badge"></span>
        </div>

        <!-- Combat / Arena minor button -->
        <div class="combat-group d-flex flex-column align-items-center me-2 position-relative">
          <div class="arena-btn position-relative" (click)="onFeatureClick({name: 'Đấu Trường', icon: '', hasNotification: false})">
            <span class="arena-text">Đấu Trường</span>
          </div>
          
          <!-- Highlighted Button (Chính Tuyến / Vượt Ải) -->
          <div class="focus-btn-container" (click)="goToBattle()">
            <div class="focus-btn-pulse"></div>
            <div class="focus-btn-pulse pulse-delay"></div>
            <button class="btn btn-chinh-tuyen d-flex flex-column align-items-center justify-content-center">
              <span class="chinh-tuyen-label">Chính Tuyến</span>
            </button>
            <!-- Guide Hand pointer -->
            <div class="pointer-hand">
              <i class="bi bi-hand-index-thumb-fill text-warning fs-3"></i>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
